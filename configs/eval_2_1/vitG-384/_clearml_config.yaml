cpus_per_task: 12
eval_name: video_classification_frozen
experiment:
  classifier:
    num_heads: 16
    num_probe_blocks: 4
  data:
    dataset_train: /tf/data/dataset-2classes/train_balanced.csv
    dataset_type: VideoDataset
    dataset_val: /tf/data/dataset-2classes/val_balanced.csv
    frame_step: 4
    frames_per_clip: 16
    num_classes: 2
    num_segments: 1
    num_views_per_segment: 3
    resolution: 384
  optimization:
    batch_size: 4
    multihead_kwargs:
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.001
      start_lr: 0.001
      warmup: 0.0
      weight_decay: 0.01
    num_epochs: 5
    use_bfloat16: true
    use_pos_embed: false
folder: /tf/data/outputs/evals_2_1/vitG-384/weaponized_2cls
model_kwargs:
  checkpoint: /tf/data/pretrained-models/vjepa2_1_vitG_384.pt
  module_name: evals.video_classification_frozen.modelcustom.vit_encoder_multiclip
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      img_temporal_dim_size: 1
      model_name: vit_gigantic_xformers
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
nodes: 1
num_workers: 8
resume_checkpoint: false
snapshot_freq: 5
tag: weaponized-2cls-vitg16-384
tasks_per_node: 1
